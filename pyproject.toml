[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenEduVoice"
version = "0.1.0"
description = "Offline PowerPoint audio and PDF translation, transcription, and TTS tool"
requires-python = ">=3.11,<3.12"
dependencies = [
    "coqui-tts>=0.27.5,<0.28",
    "faster-whisper>=1.2.1,<2",
    "lxml>=6.0.2,<7",
    "Pillow>=12.1.0,<13",
    "PyMuPDF>=1.26.7,<2.0",
    "pydub>=0.25.1,<0.26",
    "pytesseract>=0.3.13,<0.4",
    "sentencepiece>=0.2.1,<0.3",
    "torch>=2.6",
    "torchaudio>=2.6",
    "transformers>=5.0.0,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"OpenEduVoice.utils" = ["term_map.json"]